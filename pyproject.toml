[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aix8-pan"
version = "1.2.0"
description = "115 个人网盘 AI 助手 + 影视资源整理刮削工具（OpenList 桥接 + TMDB）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aix8fun" }]
keywords = ["mcp", "115", "openlist", "tmdb", "media", "scraper"]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2.3",
]

[project.urls]
Homepage = "https://github.com/aix8fun/aix8-pan"
Issues = "https://github.com/aix8fun/aix8-pan/issues"

[project.scripts]
aix8-pan = "aix8pan.server:main"

[tool.hatch.build.targets.wheel]
packages = ["aix8pan"]

[tool.hatch.build.targets.sdist]
include = ["aix8pan", "README.md", "SPEC.md", "pyproject.toml"]
